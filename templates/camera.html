      const pickr = Pickr.create({
          el: '.color-choice',
          theme: 'classic', // or 'monolith', or 'nano'
          default: "#ffffff",

          swatches: [
              'rgba(244, 67, 54, 1)',
              'rgba(233, 30, 99, 0.95)',
              'rgba(156, 39, 176, 0.9)',
              'rgba(103, 58, 183, 0.85)',
              'rgba(63, 81, 181, 0.8)',
              'rgba(33, 150, 243, 0.75)',
              'rgba(3, 169, 244, 0.7)',
              'rgba(0, 188, 212, 0.7)',
              'rgba(0, 150, 136, 0.75)',
              'rgba(76, 175, 80, 0.8)',

              // Input / output Options

    <!-- Script to change the color of the photostrip -->
    <script>
        const snapshotContainer = document.getElementById("snapshot-container");
        pickr.on('save', (color) => {
            snapshotContainer.style.backgroundColor = color.toRGBA().toString();
        });
    </script>

    <!-- Script to turn on camera -->
    <script>
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            const cam = document.getElementById("camera");
            cam.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera error:", err);
            document.getElementById("ready-prompt").textContent = "Camera access is required. Please allow it and reload.";
        });
    </script>

    <!-- Script to set prompt text based on layout & set-up camera aspect ratio -->
    <script>
      window.addEventListener('load', () => {
        const prompt = document.getElementById("ready-prompt");
        const frame = document.querySelector(".main-frame");
        const cam = document.getElementById("camera");
        const prev = document.getElementById("preview");
        const canvas = document.getElementById("canvas");
        const selectedLayout = sessionStorage.getItem("selectedLayout") || "layout-1";
        const photoCount = Number(sessionStorage.getItem("selectedPhotoCount")) || 3;
        prompt.innerHTML = `Get ready for ${photoCount} picture${photoCount === 1 ? "" : "s"}!`;
        if(selectedLayout === "layout-1"){
        } else if(selectedLayout === "layout-2"){
          frame.classList.add("portrait");
          cam.classList.add("portrait");
          prev.classList.add("portrait");
          canvas.classList.add("portrait");
        } else {
          frame.classList.add("wide");
        }
      });

    </script>

    <!-- Script to handle flash effect -->
    <script>
        function flash() {
          const flash = document.getElementById("flash");
          flash.classList.remove("flash"); // reset
          void flash.offsetWidth;          // reflow (tells the browser to run/apple ALL the CSS changes IMMEDIATELY)
          flash.classList.add("flash");
        }
    </script>
    <!-- Script to handle filter options -->
     <script>
        function applyFilter(filterType) {
          const video = document.getElementById("snapshot-container");
          const images = video.querySelectorAll("img");
          switch(filterType) {
            case 'default':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('sepia');
                img.classList.remove('film');
              });
              break;
            case 'grayscale':
              images.forEach(img => {
                img.classList.remove('sepia');
                img.classList.remove('film');
                img.classList.add('grayscale');
              });
              break;
            case 'sepia':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('film');
                img.classList.add('sepia');
              });
              break;
            case 'film':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('sepia');
                img.classList.add('film');
              });
              break;
            default:
              video.style.filter = 'none';
          }
        }
     </script>
    <!-- Script to take picture -->
    <script>
        const sleep = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

        function cameraIsReady() {
          const video = document.getElementById("camera");
          if (video.srcObject && video.readyState >= 2) return true;
          document.getElementById("ready-prompt").textContent = "Camera is not ready yet.";
          return false;
        }

        async function capturePhoto() {
          const prompt = document.getElementById("ready-prompt");
          const video = document.getElementById("camera");
          const canvas = document.getElementById("canvas");
          const preview = document.getElementById("preview");
          const selectedLayout = sessionStorage.getItem("selectedLayout") || "layout-1";

          prompt.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
          for (let count = 3; count > 0; count--) {
            prompt.textContent = count;
            await sleep(1000);
          }
          prompt.textContent = "";
          prompt.style.backgroundColor = "transparent";

          const targetRatio = selectedLayout === "layout-2" ? 2 / 3 : selectedLayout === "layout-3" ? 16 / 9 : 4 / 3;
          let cropWidth = video.videoWidth;
          let cropHeight = cropWidth / targetRatio;
          if (cropHeight > video.videoHeight) {
            cropHeight = video.videoHeight;
            cropWidth = cropHeight * targetRatio;
          }

          const cropX = (video.videoWidth - cropWidth) / 2;
          const cropY = (video.videoHeight - cropHeight) / 2;
          canvas.width = Math.min(900, cropWidth);
          canvas.height = canvas.width / targetRatio;

          flash();
          await sleep(80);
          canvas.getContext("2d").drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/png");

          preview.src = imageData;
          preview.style.display = "block";
          await sleep(900);
          preview.style.display = "none";
          return imageData;
        }

        function createSnapshot(imageData, photoNumber) {
          const image = document.createElement("img");
          image.src = imageData;
          image.dataset.originalSrc = imageData;
          image.alt = `Snapshot ${photoNumber}. Click to enlarge or retake.`;
          image.tabIndex = 0;
          image.dataset.photoNumber = photoNumber;
          image.addEventListener("click", () => openPhotoModal(image));
          image.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openPhotoModal(image);
            }
          });
          return image;
        }

        async function takePicture() {
          if (!cameraIsReady()) return;
          const captureButton = document.getElementById("capture-button");
          const progress = document.getElementById("shot-progress");
          const container = document.getElementById("snapshot-container");
          const photoCount = Number(sessionStorage.getItem("selectedPhotoCount")) || 3;

          captureButton.disabled = true;
          container.replaceChildren();
          for (let index = 0; index < photoCount; index++) {
            progress.textContent = `Photo ${index + 1} of ${photoCount}`;
            container.appendChild(createSnapshot(await capturePhoto(), index + 1));
          }

          const prompt = document.getElementById("ready-prompt");
          prompt.textContent = "All done! Click a photo to preview or retake it.";
          prompt.style.backgroundColor = "rgba(0, 0, 0, 0.35)";
          progress.textContent = `${photoCount} photos captured. Select any photo to review it.`;
          captureButton.disabled = false;
          applyAllPhotoAdjustments();
        }
    </script>

    <!-- Slider-based photo adjustments -->
    <script>
      const adjustmentInputs = [...document.querySelectorAll("[data-adjustment]")];
      const adjustmentStatus = document.getElementById("adjustment-status");
      let adjustmentTimer;
      let adjustmentRun = 0;

      function adjustmentValues() {
        return Object.fromEntries(adjustmentInputs.map(input => [input.id, Number(input.value)]));
      }

      function updateAdjustmentLabels() {
        adjustmentInputs.forEach(input => {
          const output = document.querySelector(`output[for="${input.id}"]`);
          output.value = input.id === "exposure" ? `${Number(input.value) > 0 ? "+" : ""}${input.value} EV` : input.value;
        });
      }

      function loadEditorImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = source;
        });
      }

      function blurPixels(source, width, height, amount) {
        if (!amount) return source;
        const result = new Uint8ClampedArray(source);
        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const index = (y * width + x) * 4;
            for (let channel = 0; channel < 3; channel++) {
              const average = (source[index + channel] + source[index - 4 + channel] + source[index + 4 + channel] + source[index - width * 4 + channel] + source[index + width * 4 + channel]) / 5;
              result[index + channel] = source[index + channel] * (1 - amount) + average * amount;
            }
          }
        }
        return result;
      }

      function sharpenPixels(source, width, height, strength) {
        if (!strength) return source;
        const result = new Uint8ClampedArray(source);
        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const index = (y * width + x) * 4;
            for (let channel = 0; channel < 3; channel++) {
              const neighbors = source[index - 4 + channel] + source[index + 4 + channel] + source[index - width * 4 + channel] + source[index + width * 4 + channel];
              result[index + channel] = source[index + channel] * (1 + 4 * strength) - neighbors * strength;
            }
          }
        }
        return result;
      }

      async function applyAdjustmentsToImage(snapshot, values, runId = adjustmentRun) {
        const sourceImage = await loadEditorImage(snapshot.dataset.originalSrc);
        if (runId !== adjustmentRun) return;
        const canvas = document.createElement("canvas");
        canvas.width = sourceImage.naturalWidth;
        canvas.height = sourceImage.naturalHeight;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(sourceImage, 0, 0);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        const exposure = 2 ** values.exposure;
        const contrast = (259 * (values.contrast + 255)) / (255 * (259 - values.contrast));
        const saturation = 1 + values.saturation / 100;
        const temperature = values["white-balance"] / 100;

        for (let index = 0; index < pixels.length; index += 4) {
          let red = pixels[index] * exposure + temperature * 28;
          let green = pixels[index + 1] * exposure + temperature * 4;
          let blue = pixels[index + 2] * exposure - temperature * 28;
          red = contrast * (red - 128) + 128;
          green = contrast * (green - 128) + 128;
          blue = contrast * (blue - 128) + 128;
          const luminance = .2126 * red + .7152 * green + .0722 * blue;
          pixels[index] = luminance + (red - luminance) * saturation;
          pixels[index + 1] = luminance + (green - luminance) * saturation;
          pixels[index + 2] = luminance + (blue - luminance) * saturation;
        }

        let processed = blurPixels(pixels, canvas.width, canvas.height, values["noise-reduction"] / 100);
        processed = sharpenPixels(processed, canvas.width, canvas.height, values.sharpening / 100);
        imageData.data.set(processed);
        context.putImageData(imageData, 0, 0);
        if (runId === adjustmentRun) {
          snapshot.src = canvas.toDataURL("image/jpeg", .92);
          if (selectedSnapshot === snapshot && !photoModal.hidden) zoomedPhoto.src = snapshot.src;
        }
      }

      async function applyAllPhotoAdjustments() {
        const snapshots = [...document.querySelectorAll("#snapshot-container img")];
        if (!snapshots.length) {
          adjustmentStatus.textContent = "Capture photos to start editing.";
          return;
        }
        const runId = ++adjustmentRun;
        adjustmentStatus.textContent = "Applying adjustments...";
        await Promise.all(snapshots.map(snapshot => applyAdjustmentsToImage(snapshot, adjustmentValues(), runId)));
        if (runId === adjustmentRun) adjustmentStatus.textContent = "Adjustments applied.";
      }

      adjustmentInputs.forEach(input => input.addEventListener("input", () => {
        updateAdjustmentLabels();
        clearTimeout(adjustmentTimer);
        adjustmentTimer = setTimeout(applyAllPhotoAdjustments, 140);
      }));

      document.getElementById("reset-adjustments").addEventListener("click", () => {
        adjustmentInputs.forEach(input => input.value = 0);
        updateAdjustmentLabels();
        applyAllPhotoAdjustments();
      });
      updateAdjustmentLabels();
    </script>

    <!-- Script to preview and retake individual snapshots -->
    <script>
      const photoModal = document.getElementById("photo-modal");
      const zoomedPhoto = document.getElementById("zoomed-photo");
      const retakeButton = document.getElementById("retake-button");
      let selectedSnapshot = null;

      function openPhotoModal(image) {
        selectedSnapshot = image;
        zoomedPhoto.src = image.src;
        zoomedPhoto.className = image.className;
        photoModal.hidden = false;
        document.body.classList.add("modal-open");
        retakeButton.focus();
      }

      function closePhotoModal() {
        if (photoModal.hidden) return;
        photoModal.hidden = true;
        document.body.classList.remove("modal-open");
        if (selectedSnapshot) selectedSnapshot.focus();
      }

      photoModal.querySelectorAll("[data-close-modal]").forEach(control => {
        control.addEventListener("click", closePhotoModal);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !photoModal.hidden) closePhotoModal();
      });

      retakeButton.addEventListener("click", async () => {
        if (!selectedSnapshot || !cameraIsReady()) return;
        const imageToReplace = selectedSnapshot;
        const captureButton = document.getElementById("capture-button");
        const photoNumber = imageToReplace.dataset.photoNumber;

        closePhotoModal();
        captureButton.disabled = true;
        retakeButton.disabled = true;
        document.querySelector(".camera-wrap").scrollIntoView({ behavior: "smooth", block: "center" });
        document.getElementById("shot-progress").textContent = `Retaking photo ${photoNumber}...`;

        const newImageData = await capturePhoto();
        imageToReplace.dataset.originalSrc = newImageData;
        imageToReplace.src = newImageData;
        await applyAdjustmentsToImage(imageToReplace, adjustmentValues());
        document.getElementById("ready-prompt").textContent = "Photo replaced!";
        document.getElementById("ready-prompt").style.backgroundColor = "rgba(0, 0, 0, 0.35)";
        document.getElementById("shot-progress").textContent = `Photo ${photoNumber} was retaken. Select a photo to review it.`;
        captureButton.disabled = false;
        retakeButton.disabled = false;
      });
    </script>

    <!-- Script to download the snapshot -->
     <script>
      function presetFilterFor(image) {
        if (image.classList.contains("grayscale")) return "grayscale(100%)";
        if (image.classList.contains("sepia")) return "sepia(60%)";
        if (image.classList.contains("film")) return "saturate(116%) hue-rotate(348deg)";
        return "none";
      }

      document.getElementById("download").addEventListener("click", async () => {
        const downloadButton = document.getElementById("download");
        const strip = document.getElementById("snapshot-container");
        const snapshots = [...strip.querySelectorAll("img")];
        if (!snapshots.length) {
          adjustmentStatus.textContent = "Capture at least one photo before downloading.";
          return;
        }

        downloadButton.disabled = true;
        downloadButton.textContent = "Preparing...";
        clearTimeout(adjustmentTimer);

        try {
          // Finish the latest slider changes before composing the downloaded strip.
          await applyAllPhotoAdjustments();

          const scale = 3;
          const exportCanvas = document.createElement("canvas");
          exportCanvas.width = Math.round(strip.clientWidth * scale);
          exportCanvas.height = Math.round(Math.max(strip.clientHeight, strip.scrollHeight) * scale);
          const context = exportCanvas.getContext("2d");
          context.scale(scale, scale);
          context.fillStyle = getComputedStyle(strip).backgroundColor || "#ffffff";
          context.fillRect(0, 0, exportCanvas.width / scale, exportCanvas.height / scale);
          const stripBounds = strip.getBoundingClientRect();

          for (const snapshot of snapshots) {
            const renderedImage = await loadEditorImage(snapshot.src);
            const imageBounds = snapshot.getBoundingClientRect();
            const x = imageBounds.left - stripBounds.left;
            const y = imageBounds.top - stripBounds.top;
            const width = imageBounds.width;
            const height = imageBounds.height;

            context.save();
            context.filter = presetFilterFor(snapshot);
            // The live camera and snapshot preview are mirrored, so mirror the export too.
            context.translate(x + width, y);
            context.scale(-1, 1);
            context.drawImage(renderedImage, 0, 0, width, height);
            context.restore();
          }

          const link = document.createElement("a");
          link.download = "gunita-photo-strip.png";
          link.href = exportCanvas.toDataURL("image/png");
          link.click();
          adjustmentStatus.textContent = "Photo strip downloaded with all edits.";
        } catch (error) {
          console.error("Download error:", error);
          adjustmentStatus.textContent = "The download could not be prepared. Please try again.";
        } finally {
          downloadButton.disabled = false;
          downloadButton.textContent = "Download";
        }
      });
     </script>
