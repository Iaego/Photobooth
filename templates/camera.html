<body style="background-color: #f9c96e;">

<!-- Select a layout -->
 <div class="main d-flex justify-content-center">
    <div class="layout d-flex flex-column align-items-center py-5 mt-5">
    <!-- Photobooth -->
          <div class="row">
              <div class="hero text-center">
                  <h1>Start Snapping</h1>
              </div>
          </div>
          <div class="row align-items-center">
              <div class="main-frame text-center">
                  <div id="ready-prompt" class="ready-prompt d-flex justify-content-center align-items-center">Click CAPTURE when ready!</div>
                  <video id="camera" autoplay playsinline></video>
                  <canvas id="canvas" style="display:none;"></canvas>         
              </div>
          </div>
          <div class="row mt-2">
              <div class="button-group text-center">
                  <button class="button" input="submit" onclick="takePicture()">Capture</button>
                  <button class="button">Filter 2</button>
              </div>
          </div>
          <div id="snapshot-container" class="row mt-4 text-center">
              <h2>Snapshots</h2>

          </div>
    </div>
  </div>
    


    <!-- Script to turn on camera -->
    <script>
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            const cam = document.getElementById("camera");
            cam.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera error:", err);
        });
    </script>

    <!-- Script to take picture -->
    <script>
        async function takePicture() {
            const prompt = document.getElementById("ready-prompt");
            var countPic = 0;
            const selectedLayout = sessionStorage.getItem("selectedLayout");
            if(selectedLayout === "layout-1"){
              prompt.innerHTML = "Get ready for 3 pictures!";
              countPic = 3;
            } else if(selectedLayout === "layout-2"){
              prompt.innerHTML = "Get ready for 2 pictures!";
              countPic = 2;
            } else {
              prompt.innerHTML = "Get ready for 4 pictures!"; 
              countPic = 4; 
            }
            for(let j = countPic; j > 0; j--){
              for(let i = 3; i > 0; i--){
                prompt.innerHTML = i;
                await new Promise(resolve => setTimeout(resolve, 1000));
              }

              const video = document.getElementById("camera");
              const canvas = document.getElementById("canvas");
              const ctx = canvas.getContext("2d");

              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              
              ctx.drawImage(video, 0, 0);
              const imgData = canvas.toDataURL("image/png");

              const img = document.createElement("img");
              img.src = imgData;
              img.width = 300;
              img.style = "transform: scaleX(-1)"; // mirror the image
              document.getElementById("snapshot-container").appendChild(img);
            }

        }
    </script>

    

</body>
