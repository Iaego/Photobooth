<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take your photos | Gunita Studios</title>
  <link rel="stylesheet" href="../static/css/style.css">

  <!-- Bootstrap CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <!-- Pickr from https://github.com/simonwep/pickr--> 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/> <!-- 'classic' theme -->

  <!-- Script to download DIV to img (html2canvas) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  </head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Gunita Studios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="layout.html">Choose photos</a>
            <a class="nav-link active" aria-current="page" href="camera.html">Camera</a>
        </div>
        </div>  
    </div>
  </nav>

<!-- Select a layout -->
 <main class="page-shell">
    <div class="layout camera-panel">
    <!-- Photobooth -->
          <div class="text-center">
              <div class="hero text-center">
                  <h1>Start Snapping</h1>
              </div>
          </div>
          <div class="camera-wrap">
              <div class="main-frame">
                  <div id="flash"></div>
                  <div id="ready-prompt" class="ready-prompt d-flex justify-content-center align-items-center">Click CAPTURE when ready!</div>
                  <img id="preview" alt="Preview">
                  <video id="camera" autoplay playsinline></video>
                  <canvas id="canvas"></canvas>         
              </div>
          </div>
          <div class="capture-actions">
              <div class="button-group text-center">
                  <button type="button" class="btn btn-dark capture-button" id="capture-button" onclick="takePicture()">Capture</button>
              </div>
          </div>
          <div class="snapshot-title"><h2>Snapshots</h2><p id="shot-progress">Your photos will appear below.</p></div>

          <!-- Edit Photostrip -->
          <div class="edit-strip">
            <div id="snapshot-container" class="snapshot-strip d-flex flex-column align-items-center">
                  <!-- <img src="../media/test-shot1.png" alt="">
                  <img src="../media/test-shot2.png" alt="">
                  <img src="../media/test-shot3.png" alt=""> -->
            </div>
              <div class="operations">
              <div class="select-edit">
                <div class="color-select">
                  <h2>Pick a color</h2>
                  <div class="color-choice m-2">
                    <div class="color-picker p-3"></div>
                  </div>
                </div> 
                <div class="filter-edit">
                  <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                      Filter Options
                    </button>
                    <ul class="dropdown-menu">
                      <li><button class="dropdown-item" type="button" onclick="applyFilter('default')">Default</button></li>
                      <li><button class="dropdown-item" type="button" onclick="applyFilter('grayscale')">Black and White</button></li>
                      <li><button class="dropdown-item" type="button" onclick="applyFilter('sepia')">Sepia</button></li>
                      <li><button class="dropdown-item" type="button" onclick="applyFilter('film')">Film</button></li>
                    </ul>
                  </div>
                </div>
              </div>
              <button type="button" class="btn btn-dark" id="download">Download</button>
            </div>
          </div>

    </div>
  </main>

  <div class="photo-modal" id="photo-modal" role="dialog" aria-modal="true" aria-labelledby="photo-modal-title" hidden>
    <div class="photo-modal__backdrop" data-close-modal></div>
    <div class="photo-modal__content">
      <button class="photo-modal__close" type="button" data-close-modal aria-label="Close photo preview">&times;</button>
      <h2 id="photo-modal-title">Photo preview</h2>
      <img id="zoomed-photo" alt="Selected snapshot enlarged">
      <div class="photo-modal__actions">
        <button class="btn btn-outline-light" type="button" data-close-modal>Close</button>
        <button class="btn btn-light" id="retake-button" type="button">Retake this photo</button>
      </div>
    </div>
  </div>
    
    <!-- Pickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script>
      // Create Pickr instance
      const pickr = Pickr.create({
          el: '.color-choice',
          theme: 'classic', // or 'monolith', or 'nano'
          default: "#ffffff",

          swatches: [
              'rgba(244, 67, 54, 1)',
              'rgba(233, 30, 99, 0.95)',
              'rgba(156, 39, 176, 0.9)',
              'rgba(103, 58, 183, 0.85)',
              'rgba(63, 81, 181, 0.8)',
              'rgba(33, 150, 243, 0.75)',
              'rgba(3, 169, 244, 0.7)',
              'rgba(0, 188, 212, 0.7)',
              'rgba(0, 150, 136, 0.75)',
              'rgba(76, 175, 80, 0.8)',
              'rgba(139, 195, 74, 0.85)',
              'rgba(205, 220, 57, 0.9)',
              'rgba(255, 235, 59, 0.95)',
              'rgba(255, 193, 7, 1)'
          ],

          components: {

              // Main components
              preview: true,
              opacity: true,
              hue: true,

              // Input / output Options
              interaction: {
                  hex: true,
                  rgba: true,
                  hsla: true,
                  hsva: true,
                  cmyk: true,
                  input: true,
                  clear: true,
                  save: true
              }
          }
      });
    </script>

    <!-- Script to change the color of the photostrip -->
    <script>
        const snapshotContainer = document.getElementById("snapshot-container");
        pickr.on('save', (color) => {
            snapshotContainer.style.backgroundColor = color.toRGBA().toString();
        });
    </script>

    <!-- Script to turn on camera -->
    <script>
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            const cam = document.getElementById("camera");
            cam.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera error:", err);
            document.getElementById("ready-prompt").textContent = "Camera access is required. Please allow it and reload.";
        });
    </script>

    <!-- Script to set prompt text based on layout & set-up camera aspect ratio -->
    <script>
      window.addEventListener('load', () => {
        const prompt = document.getElementById("ready-prompt");
        const frame = document.querySelector(".main-frame");
        const cam = document.getElementById("camera");
        const prev = document.getElementById("preview");
        const canvas = document.getElementById("canvas");
        const selectedLayout = sessionStorage.getItem("selectedLayout") || "layout-1";
        const photoCount = Number(sessionStorage.getItem("selectedPhotoCount")) || 3;
        prompt.innerHTML = `Get ready for ${photoCount} picture${photoCount === 1 ? "" : "s"}!`;
        if(selectedLayout === "layout-1"){
        } else if(selectedLayout === "layout-2"){
          frame.classList.add("portrait");
          cam.classList.add("portrait");
          prev.classList.add("portrait");
          canvas.classList.add("portrait");
        } else {
          frame.classList.add("wide");
        }
      });

    </script>

    <!-- Script to handle flash effect -->
    <script>
        function flash() {
          const flash = document.getElementById("flash");
          flash.classList.remove("flash"); // reset
          void flash.offsetWidth;          // reflow (tells the browser to run/apple ALL the CSS changes IMMEDIATELY)
          flash.classList.add("flash");
        }
    </script>
    <!-- Script to handle filter options -->
     <script>
        function applyFilter(filterType) {
          const video = document.getElementById("snapshot-container");
          const images = video.querySelectorAll("img");
          switch(filterType) {
            case 'default':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('sepia');
                img.classList.remove('film');
              });
              break;
            case 'grayscale':
              images.forEach(img => {
                img.classList.remove('sepia');
                img.classList.remove('film');
                img.classList.add('grayscale');
              });
              break;
            case 'sepia':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('film');
                img.classList.add('sepia');
              });
              break;
            case 'film':
              images.forEach(img => {
                img.classList.remove('grayscale');
                img.classList.remove('sepia');
                img.classList.add('film');
              });
              break;
            default:
              video.style.filter = 'none';
          }
        }
     </script>
    <!-- Script to take picture -->
    <script>
        const sleep = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

        function cameraIsReady() {
          const video = document.getElementById("camera");
          if (video.srcObject && video.readyState >= 2) return true;
          document.getElementById("ready-prompt").textContent = "Camera is not ready yet.";
          return false;
        }

        async function capturePhoto() {
          const prompt = document.getElementById("ready-prompt");
          const video = document.getElementById("camera");
          const canvas = document.getElementById("canvas");
          const preview = document.getElementById("preview");
          const selectedLayout = sessionStorage.getItem("selectedLayout") || "layout-1";

          prompt.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
          for (let count = 3; count > 0; count--) {
            prompt.textContent = count;
            await sleep(1000);
          }
          prompt.textContent = "";
          prompt.style.backgroundColor = "transparent";

          const targetRatio = selectedLayout === "layout-2" ? 2 / 3 : selectedLayout === "layout-3" ? 16 / 9 : 4 / 3;
          let cropWidth = video.videoWidth;
          let cropHeight = cropWidth / targetRatio;
          if (cropHeight > video.videoHeight) {
            cropHeight = video.videoHeight;
            cropWidth = cropHeight * targetRatio;
          }

          const cropX = (video.videoWidth - cropWidth) / 2;
          const cropY = (video.videoHeight - cropHeight) / 2;
          canvas.width = Math.min(900, cropWidth);
          canvas.height = canvas.width / targetRatio;

          flash();
          await sleep(80);
          canvas.getContext("2d").drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/png");

          preview.src = imageData;
          preview.style.display = "block";
          await sleep(900);
          preview.style.display = "none";
          return imageData;
        }

        function createSnapshot(imageData, photoNumber) {
          const image = document.createElement("img");
          image.src = imageData;
          image.alt = `Snapshot ${photoNumber}. Click to enlarge or retake.`;
          image.tabIndex = 0;
          image.dataset.photoNumber = photoNumber;
          image.addEventListener("click", () => openPhotoModal(image));
          image.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openPhotoModal(image);
            }
          });
          return image;
        }

        async function takePicture() {
          if (!cameraIsReady()) return;
          const captureButton = document.getElementById("capture-button");
          const progress = document.getElementById("shot-progress");
          const container = document.getElementById("snapshot-container");
          const photoCount = Number(sessionStorage.getItem("selectedPhotoCount")) || 3;

          captureButton.disabled = true;
          container.replaceChildren();
          for (let index = 0; index < photoCount; index++) {
            progress.textContent = `Photo ${index + 1} of ${photoCount}`;
            container.appendChild(createSnapshot(await capturePhoto(), index + 1));
          }

          const prompt = document.getElementById("ready-prompt");
          prompt.textContent = "All done! Click a photo to preview or retake it.";
          prompt.style.backgroundColor = "rgba(0, 0, 0, 0.35)";
          progress.textContent = `${photoCount} photos captured. Select any photo to review it.`;
          captureButton.disabled = false;
        }
    </script>

    <!-- Script to preview and retake individual snapshots -->
    <script>
      const photoModal = document.getElementById("photo-modal");
      const zoomedPhoto = document.getElementById("zoomed-photo");
      const retakeButton = document.getElementById("retake-button");
      let selectedSnapshot = null;

      function openPhotoModal(image) {
        selectedSnapshot = image;
        zoomedPhoto.src = image.src;
        zoomedPhoto.className = image.className;
        photoModal.hidden = false;
        document.body.classList.add("modal-open");
        retakeButton.focus();
      }

      function closePhotoModal() {
        if (photoModal.hidden) return;
        photoModal.hidden = true;
        document.body.classList.remove("modal-open");
        if (selectedSnapshot) selectedSnapshot.focus();
      }

      photoModal.querySelectorAll("[data-close-modal]").forEach(control => {
        control.addEventListener("click", closePhotoModal);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !photoModal.hidden) closePhotoModal();
      });

      retakeButton.addEventListener("click", async () => {
        if (!selectedSnapshot || !cameraIsReady()) return;
        const imageToReplace = selectedSnapshot;
        const captureButton = document.getElementById("capture-button");
        const photoNumber = imageToReplace.dataset.photoNumber;

        closePhotoModal();
        captureButton.disabled = true;
        retakeButton.disabled = true;
        document.querySelector(".camera-wrap").scrollIntoView({ behavior: "smooth", block: "center" });
        document.getElementById("shot-progress").textContent = `Retaking photo ${photoNumber}...`;

        const newImageData = await capturePhoto();
        imageToReplace.src = newImageData;
        document.getElementById("ready-prompt").textContent = "Photo replaced!";
        document.getElementById("ready-prompt").style.backgroundColor = "rgba(0, 0, 0, 0.35)";
        document.getElementById("shot-progress").textContent = `Photo ${photoNumber} was retaken. Select a photo to review it.`;
        captureButton.disabled = false;
        retakeButton.disabled = false;
      });
    </script>

    <!-- Script to download the snapshot -->
     <script>
        document.getElementById("download").addEventListener("click", () => {
        const div = document.getElementById("snapshot-container");

        html2canvas(div, {
          scale: 2,           // higher quality
          useCORS: true,      // allow external images
          backgroundColor: null
        }).then(canvas => {
          const link = document.createElement("a");
          link.download = "photo.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
      });
     </script>

    

</body>

</html>
