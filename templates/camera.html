 <div class="main d-flex justify-content-center">

    <!-- Script to turn on camera -->
    <script>
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            const cam = document.getElementById("camera");
            cam.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera error:", err);
        });
    </script>

    <!-- Script to set prompt text based on layout & set-up camera aspect ratio -->
    <script>
      window.addEventListener('load', () => {
        const prompt = document.getElementById("ready-prompt");
        const frame = document.querySelector(".main-frame");
        const cam = document.getElementById("camera");
        const prev = document.getElementById("preview");
        const canvas = document.getElementById("canvas");
        const selectedLayout = sessionStorage.getItem("selectedLayout");
        if(selectedLayout === "layout-1"){
          prompt.innerHTML = "Get ready for 3 pictures!";
        } else if(selectedLayout === "layout-2"){
          prompt.innerHTML = "Get ready for 2 pictures!";
          frame.classList.add("portrait");
          cam.classList.add("portrait");
          prev.classList.add("portrait");
          canvas.classList.add("portrait");
        } else {
          frame.classList.add("wide");
          prompt.innerHTML = "Get ready for 4 pictures!"; 
        }
      });

    </script>

    <!-- Script to handle flash effect -->
    <script>
        function flash() {
          const flash = document.getElementById("flash");
          flash.classList.remove("flash"); // reset
          void flash.offsetWidth;          // reflow (tells the browser to run/apple ALL the CSS changes IMMEDIATELY)
          flash.classList.add("flash");
        }
    </script>

    <!-- Script to take picture -->
    <script>
        async function takePicture() {
            const prompt = document.getElementById("ready-prompt");
            var countPic = 0;
            const selectedLayout = sessionStorage.getItem("selectedLayout");
            if(selectedLayout === "layout-1"){
              countPic = 3;
            } else if(selectedLayout === "layout-2"){
              countPic = 2;
            } else {
              countPic = 4; 
            }
            for(let j = countPic; j > 0; j--){
              prompt.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
              for(let i = 3; i > 0; i--){
                prompt.innerHTML = i;
                await new Promise(resolve => setTimeout(resolve, 1000));
                if(i == 1){
                  prompt.innerHTML = "";
                  prompt.style.backgroundColor = "rgba(0, 0, 0, 0)";
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
              
              const preview = document.getElementById("preview");
              const video = document.getElementById("camera");
              const canvas = document.getElementById("canvas");
              const ctx = canvas.getContext("2d");
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;

              flash(); // Trigger flash effect

              // Slight delay so flash happens before capture
              await new Promise(resolve => setTimeout(resolve, 80));

              ctx.drawImage(video, 0, 0);
              if(selectedLayout === "layout-2"){
                const videoW = video.videoWidth;
                const videoH = video.videoHeight;

                // Target portrait ratio
                const targetRatio = 2 / 3;

                // Compute crop size
                let cropW = videoW;
                let cropH = cropW / targetRatio;

                if (cropH > videoH) {
                  cropH = videoH;
                  cropW = cropH * targetRatio;
                }

                // Center crop
                const cropX = (videoW - cropW) / 2;
                const cropY = (videoH - cropH) / 2;

                // Canvas output size = cropped size
                canvas.width = cropW;
                canvas.height = cropH;

                // Mirror fix
                ctx.save();
                ctx.drawImage(
                  video,
                  cropX, cropY, cropW, cropH,
                  0, 0, canvas.width, canvas.height
                );
                ctx.restore();
              }else if(selectedLayout === "layout-1"){
                const videoW = video.videoWidth;
                const videoH = video.videoHeight;

                // Target ratio: 4:3 (width / height)
                const targetRatio = 4 / 3;

                let cropW = videoW;
                let cropH = cropW / targetRatio;

                if(cropH > videoH){
                    cropH = videoH;
                    cropW = cropH * targetRatio;
                }

                // Center crop
                const cropX = (videoW - cropW)/2;
                const cropY = (videoH - cropH)/2;

                // Canvas output size
                canvas.width = 600;          // desired width
                canvas.height = canvas.width / targetRatio;

                ctx.drawImage(
                    video,
                    cropX, cropY, cropW, cropH,
                    0, 0, canvas.width, canvas.height
                );
              }else{
                // layout-3: no crop needed, as 16:9 matches camera ratio
              }
              const imgData = canvas.toDataURL("image/png");


              /* Show preview of image */
              preview.src = imgData;
              preview.style.display = "block";

              /* Keep preview visible */
              await new Promise(r => setTimeout(r, 1200));

              /* Hide preview before next shot */
              preview.style.display = "none";

              const img = document.createElement("img");
              img.src = imgData;
              img.style.width = "100%";
              img.style.marginBottom = "12px";
              img.style = "transform: scaleX(-1)"; // mirror the image
              document.getElementById("snapshot-container").appendChild(img);
            }
        }
    </script>
