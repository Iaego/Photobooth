<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your photos | Gunita Studios</title>
    <link rel="stylesheet" href="../static/css/style.css">

    <!-- Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Gunita Studios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" aria-current="page" href="layout.html">Choose photos</a>
        </div>
        </div>  
    </div>
    </nav>

<main class="page-shell">
    <section class="layout selection-panel" aria-labelledby="layout-title">
        <div class="text-center selection-heading">
            <p class="eyebrow">Create your photo strip</p>
            <h1 id="layout-title">How many pictures?</h1>
            <p>Pick a set and we’ll take each photo automatically after a countdown.</p>
        </div>
        <div class="layout-frame">
            <button class="layout-choice" type="button" onclick="selectLayout('layout-2', 2)">
                <img src="../media/choice-2.png" class="photo-strip" alt="Two-picture portrait strip">
                <span>2 pictures</span>
            </button>
            <button class="layout-choice" type="button" onclick="selectLayout('layout-1', 3)">
                <img src="../media/choice-1.png" class="photo-strip" alt="Three-picture classic strip">
                <span>3 pictures</span>
            </button>
            <button class="layout-choice" type="button" onclick="selectLayout('layout-3', 4)">
                <img src="../media/choice-3.png" class="photo-strip" alt="Four-picture wide strip">
                <span>4 pictures</span>
            </button>
        </div>
    </section>
</main>

    <script>
        function selectLayout(layout, photoCount) {
            sessionStorage.setItem("selectedLayout", layout);
            sessionStorage.setItem("selectedPhotoCount", String(photoCount));
            window.location.href = "./camera.html";
        }
    </script>
    

</body>

</html>
