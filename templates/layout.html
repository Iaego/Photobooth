<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS-->

    <!-- Bootstrap JS -->

</head>
<body style="background-color: #f9c96e;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="#">Home</a>

            <a class="nav-link" href="#">Pricing</a>

        </div>
        </div>

<!-- Select a layout -->
<div class="main d-flex justify-content-center">
    <div class="layout d-flex flex-column justify-content-center py-5 mt-5">
        <div class="text-center my-3">
            <h2>Select a Layout</h2>
        </div>
        <div class="d-flex flex-nowrap layout-frame text-center">
            <div class="layout-choice d-flex flex-column align-items-center">
                <img src="../media/choice-1.png" class="photo-strip mx-5" alt="Layout 1">
                <button type="button" class="btn btn-primary mt-3" onclick="selectLayout('layout-1')">3 Pictures</button>
            </div>
        <div class="layout-choice d-flex flex-column align-items-center">
            <img src="../media/choice-2.png" class="photo-strip mx-5" alt="Layout 2">
            <button type="button" class="btn btn-primary mt-3" onclick="selectLayout('layout-2')">2 Pictures</button>
        </div>
            <div class="layout-choice d-flex flex-column align-items-center">
                <img src="../media/choice-3.png" class="photo-strip mx-5" alt="Layout 3">
                <button type="button" class="btn btn-primary mt-3" onclick="selectLayout('layout-3')">4 Pictures</button>
            </div>
        </div>
    </div>
</div>

    <script>
        function selectLayout(layout) {
            sessionStorage.setItem("selectedLayout", layout); // store choice for the next page

            window.location.href = "./camera.html"; // redirect to camera page
        }
    </script>
    

</body>

</html>
